[project]
name = "ai-piano-midi-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aiden Carrera" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "symusic",
    "torch",
    "tqdm",
]

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ai-piano-midi-generator = "ai_piano_midi_generator:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py313"

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--basetemp=.pytest-tmp"]
