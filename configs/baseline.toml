[data]
manifest = "data/manifests/tokenized_dataset.jsonl"
context_length = 1024

[model]
vocabulary_size = 392
context_length = 1024
embedding_size = 384
layer_count = 6
head_count = 6
feed_forward_size = 1536
dropout = 0.10

[training]
batch_size = 1
gradient_accumulation_steps = 16
maximum_steps = 20000
learning_rate = 0.0003
minimum_learning_rate = 0.00003
warmup_steps = 500
weight_decay = 0.10
gradient_clip_norm = 1.0
dropout = 0.10
evaluation_interval = 250
evaluation_batches = 40
checkpoint_interval = 500
log_interval = 10
seed = 2026
data_loader_workers = 0
amp = true

[output]
checkpoint_directory = "checkpoints/baseline"
training_report = "reports/baseline_training.json"

[sampling]
maximum_new_tokens = 1024
temperature = 0.95
top_k = 40
top_p = 0.95
seed = 2026
